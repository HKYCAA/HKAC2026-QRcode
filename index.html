<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#082f49">
    <meta
      name="description"
      content="HKAC 2026 live event QR code check-in"
    >
    <title>HKAC 2026 Check-in</title>
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="panel scanner-panel" aria-labelledby="scanner-title">
        <div class="section-heading">
          <div>
            <p class="step-label">Camera</p>
            <h2 id="scanner-title">Scan QR code</h2>
          </div>
          <span class="live-badge">Live</span>
        </div>

        <div id="reader" aria-label="QR code camera scanner"></div>

        <form id="manual-form" class="manual-form" novalidate>
          <label for="manual-code">Scanned or manual code</label>
          <div class="input-row">
            <input
              id="manual-code"
              name="code"
              type="text"
              inputmode="text"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              maxlength="128"
              placeholder="e.g. YDN0103"
            >
            <button id="manual-submit" type="submit">Check in</button>
          </div>
        </form>

        <p class="privacy-note">
          Camera processing stays on this device. The code is sent only after
          you press Check in.
        </p>
      </section>

      <section
        id="result"
        class="result result--idle"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="result-icon" aria-hidden="true">•</div>
        <div>
          <p id="result-title" class="result-title">Ready to scan</p>
          <p id="result-detail" class="result-detail">
            Point the camera at a QR code or enter a code manually.
          </p>
        </div>
      </section>

      <button id="undo-checkin" class="undo-button" type="button" hidden>
        Undo check-in
      </button>
    </main>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
